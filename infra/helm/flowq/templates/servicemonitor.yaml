{{- if .Values.monitoring.serviceMonitor.enabled }}
{{- $fullName := printf "%s-api" (include "flowq.fullname" .) -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $fullName }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "flowq.componentLabels" (dict "context" . "component" "api") | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "flowq.selectorLabels" (dict "context" . "component" "api") | nindent 6 }}
  namespaceSelector:
    matchNames: [{{ .Values.namespace.name }}]
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout }}
      honorLabels: true
{{- end }}
