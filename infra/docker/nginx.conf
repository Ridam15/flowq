# FlowQ dashboard nginx config.
#
# Listens on 8080 (so the container can run as a non-root user without
# touching privileged ports — useful for restrictive PodSecurity policies).
#
# Routes:
#   /healthz       → liveness/readiness for k8s probes
#   /config.js     → runtime config; written at container start
#   anything else  → SPA. Falls back to index.html so client-side routing works.

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Plaintext, no logging — high-frequency probe.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Runtime config is regenerated from env at container start, so it must
    # never be cached anywhere.
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files /config.js =404;
    }

    # Long-lived hashed assets — Vite emits files with content hashes in
    # the filename so a 1-year cache is safe.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback. Any unknown path returns index.html so React Router
    # (or whatever client-side router we use) can handle it.
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }

    # Defence in depth: dashboard never needs to expose dotfiles.
    location ~ /\. {
        deny all;
        return 404;
    }
}
