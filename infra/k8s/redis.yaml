# =============================================================================
# Redis — sole source of truth for queue state.
#
# Why a StatefulSet (not a Deployment):
#
#   1. Stable network identity. The pod is reachable as
#      flowq-redis-0.flowq-redis.flowq-prod.svc.cluster.local. Workers and
#      the API hardcode `flowq-redis` (the headless Service); the predictable
#      pod name matters for any future replication topology.
#
#   2. Stable storage. Each replica gets its OWN PersistentVolumeClaim via
#      `volumeClaimTemplates`, and that PVC is preserved across pod
#      reschedules. With a Deployment + a single PVC you would have to fight
#      Kubernetes about access modes (RWO disks can't be reattached during
#      rolling update), and any rebalance could lose your AOF.
#
#   3. Ordered, controlled rollout. We only run one Redis replica today,
#      but if we ever turn this into a small replication group the
#      StatefulSet guarantees primary-then-replica startup ordering.
#
# This is a single-replica deployment intended for self-hosted clusters.
# For production GKE we strongly recommend Memorystore for Redis instead;
# this manifest is the reference if you want to stay portable.
# =============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: flowq-redis
  namespace: flowq-prod
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: flowq
spec:
  # Headless service — gives every replica a DNS name. Even with one
  # replica today, this keeps the door open for replication later.
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: flowq
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: flowq-redis
  namespace: flowq-prod
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: flowq
spec:
  serviceName: flowq-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/part-of: flowq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: flowq
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args:
            - "redis-server"
            - "--appendonly"
            - "yes"
            - "--save"
            - "60 1000"
            - "--maxmemory-policy"
            - "noeviction"   # Queue keys MUST NOT be silently evicted.
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
        # Override storageClassName per-cluster if needed (e.g. "standard-rwo"
        # on GKE, "gp3" on EKS). Defaulting to whatever the cluster picks.
