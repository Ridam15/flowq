# =============================================================================
# FlowQ Dashboard — static React SPA served by nginx.
# Same shape as the API: 2 replicas behind ClusterIP + GKE Ingress.
# =============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: flowq-dashboard
  namespace: flowq-prod
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: flowq
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: flowq
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowq-dashboard
  namespace: flowq-prod
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: flowq
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
      app.kubernetes.io/part-of: flowq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard
        app.kubernetes.io/part-of: flowq
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101              # nginx user inside nginx:alpine
        fsGroup: 101
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: dashboard
              app.kubernetes.io/part-of: flowq
      containers:
        - name: dashboard
          image: gcr.io/PROJECT_ID/flowq-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Read by infra/docker/dashboard-entrypoint.sh and written into
            # /usr/share/nginx/html/config.js at container start, so the
            # browser bundle stays environment-agnostic.
            - name: FLOWQ_API_URL
              value: "https://api.flowq.example.com"
            - name: FLOWQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: flowq-secrets
                  key: API_KEY
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx writes its own pid + cache files even for purely
            # static content. Two writable emptyDirs cover that without
            # giving up the rest of the rootfs.
            #
            # Note: the entrypoint writes /usr/share/nginx/html/config.js
            # into the image's own filesystem on startup, so we deliberately
            # do NOT mount anything over /usr/share/nginx/html.
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flowq-dashboard
  namespace: flowq-prod
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: flowq
  annotations:
    kubernetes.io/ingress.class: "gce"
    # kubernetes.io/ingress.global-static-ip-name: "flowq-dashboard"
    # networking.gke.io/managed-certificates: "flowq-dashboard-cert"
spec:
  rules:
    - host: flowq.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flowq-dashboard
                port:
                  number: 80
