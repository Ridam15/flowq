# =============================================================================
# EXAMPLE SECRET — DO NOT USE IN PRODUCTION.
#
# Copy this file to `secret.yaml` (which is gitignored), replace the values
# with real credentials, and apply with:
#
#     kubectl apply -f infra/k8s/secret.yaml
#
# In production you should NOT manage Secrets this way. Use one of:
#
#   * GCP Secret Manager + the Secrets Store CSI driver
#       (recommended for GKE — secrets stay in GSM, mounted as files at runtime)
#   * External Secrets Operator pointed at GCP Secret Manager
#   * Sealed Secrets (encrypted at rest in git, decrypted in-cluster)
#
# This file exists only so a fresh `kubectl apply -k infra/k8s` works for
# local clusters (kind, minikube, k3d) where setting up GSM is overkill.
#
# Values below are base64-encoded:
#   echo -n 'my-secret-value' | base64
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: flowq-secrets
  namespace: flowq-prod
  labels:
    app.kubernetes.io/part-of: flowq
type: Opaque
data:
  # echo -n 'flowq' | base64
  POSTGRES_PASSWORD: Zmxvd3E=
  # echo -n 'dev-api-key-change-me' | base64
  API_KEY: ZGV2LWFwaS1rZXktY2hhbmdlLW1l
