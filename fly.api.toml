app = "flowq-api-ridam"
primary_region = "iad"

[build]
  dockerfile = "infra/docker/Dockerfile.api"

[env]
  NODE_ENV = "production"
  API_PORT = "3000"
  # Other required env vars will be set securely via Fly Secrets:
  # API_KEY, REDIS_HOST, REDIS_PORT, REDIS_PASSWORD, POSTGRES_HOST, POSTGRES_PORT, POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
