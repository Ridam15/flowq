<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1117" />
    <title>FlowQ — Control Plane</title>
    <!--
      Inter for sans, JetBrains Mono for monospace.
      Loaded from Google Fonts; the Tailwind config falls back to system
      monospace if the request fails (offline or strict CSP).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Runtime-injected config. In the production nginx image this file is
      generated at container start by docker-entrypoint.sh from environment
      variables. In `vite dev` it is served from /public/config.js (an empty
      stub); the build-time VITE_* vars take over in that case.
    -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
